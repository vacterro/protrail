name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      # Qt Widgets and Qt Test -- everything this project needs -- live in the
      # base install, so no add-on module is requested. `modules:` names aqt
      # add-ons only (qtwebengine, qtpdf, ...); naming a base component there
      # makes the action fail while parsing the package list.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.configuration }} --parallel 2
      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
